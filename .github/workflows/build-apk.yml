name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Capacitor and Android Platform
        run: |
          mkdir -p www
          echo '<!DOCTYPE html><html><body></body></html>' > www/index.html
          
          # The URL is now correctly pointing to your Lovable app
          echo '{
            "appId": "com.netflixmirror.app",
            "appName": "Netflix Mirror",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "url": "https://kino-sync.lovable.app/",
              "cleartext": true
            }
          }' > capacitor.config.json
          
          bun add @capacitor/core @capacitor/android
          bun add -D @capacitor/cli
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
